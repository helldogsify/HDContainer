# Публикация релиза: при пуше в main, если версии из installer.iss ещё нет
# среди релизов, собираем HDContainer.exe + HDContainer-Setup.exe на Windows
# и выкладываем релиз v<версия> — его и находит встроенное автообновление.
# Действия и пакеты закреплены по хэшу/версии: сборка не должна меняться сама
# по себе, а токен с правом записи не должен попадать в стороннее.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Read version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          $iss = Select-String -Path installer.iss -Pattern '#define MyAppVersion "([^"]+)"'
          $py  = Select-String -Path window_container.py -Pattern '^VERSION = "([^"]+)"'
          $v = $iss.Matches[0].Groups[1].Value
          if ($v -ne $py.Matches[0].Groups[1].Value) {
            throw "Version mismatch: installer.iss=$v, window_container.py=$($py.Matches[0].Groups[1].Value)"
          }
          if ($v -notmatch '^\d+(\.\d+)*$') { throw "Version must be numeric: $v" }
          $json = gh release view "v$v" --repo $env:REPO --json isDraft,assets 2>$null
          $exists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0
          if ($exists) {
            $rel = $json | ConvertFrom-Json
            if ($rel.isDraft) {
              # незаконченный черновик от прошлого прогона — убрать и собрать заново
              gh release delete "v$v" --repo $env:REPO --yes --cleanup-tag
              $exists = $false
            } else {
              Write-Host "Release v$v already exists - nothing to do."
            }
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "exists=$($exists.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.ver.outputs.exists == 'false'
        with:
          python-version: "3.12"

      - name: Build
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        run: |
          python -m pip install --upgrade "pip==26.2.2"
          python -m pip install "pyinstaller==6.22.3" "pillow==13.0.0"
          $iscc = @("C:\Program Files (x86)\Inno Setup 6\ISCC.exe", "C:\Program Files\Inno Setup 6\ISCC.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup 6 is not preinstalled on this runner image" }
          ./build.ps1
          if (-not (Test-Path dist\HDContainer-Setup.exe)) { throw "Installer was not built" }
          Get-FileHash dist\HDContainer-Setup.exe, dist\HDContainer.exe -Algorithm SHA256 | Format-List

      - name: Publish release
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          # сначала черновик с файлами, публикуем только когда оба файла загружены:
          # иначе при обрыве загрузки клиенты видели бы релиз без установщика
          gh release create "v$v" dist\HDContainer-Setup.exe dist\HDContainer.exe `
            --repo $env:REPO --target $env:SHA --draft `
            --title "v$v" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          $n = (gh release view "v$v" --repo $env:REPO --json assets | ConvertFrom-Json).assets.Count
          if ($n -ne 2) { throw "expected 2 assets, got $n" }
          gh release edit "v$v" --repo $env:REPO --draft=false
          if ($LASTEXITCODE -ne 0) { throw "gh release edit failed" }
