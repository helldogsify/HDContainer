# Публикация релиза: при пуше в main, если версии из installer.iss ещё нет
# среди релизов, собираем HDContainer.exe + HDContainer-Setup.exe на Windows
# и выкладываем релиз v<версия> — его и находит встроенное автообновление.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $iss = Select-String -Path installer.iss -Pattern '#define MyAppVersion "([^"]+)"'
          $py  = Select-String -Path window_container.py -Pattern '^VERSION = "([^"]+)"'
          $v = $iss.Matches[0].Groups[1].Value
          if ($v -ne $py.Matches[0].Groups[1].Value) {
            throw "Version mismatch: installer.iss=$v, window_container.py=$($py.Matches[0].Groups[1].Value)"
          }
          gh release view "v$v" --repo "${{ github.repository }}" 2>$null | Out-Null
          $exists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0
          "version=$v" >> $env:GITHUB_OUTPUT
          "exists=$($exists.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($exists) { Write-Host "Release v$v already exists - nothing to do." }

      - uses: actions/setup-python@v5
        if: steps.ver.outputs.exists == 'false'
        with:
          python-version: "3.12"

      - name: Build
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow
          $iscc = @("C:\Program Files (x86)\Inno Setup 6\ISCC.exe", "C:\Program Files\Inno Setup 6\ISCC.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { choco install innosetup -y --no-progress }
          ./build.ps1
          if (-not (Test-Path dist\HDContainer-Setup.exe)) { throw "Installer was not built" }

      - name: Publish release
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          gh release create "v$v" dist\HDContainer-Setup.exe dist\HDContainer.exe `
            --repo "${{ github.repository }}" --target "${{ github.sha }}" `
            --title "v$v" --notes-file release-notes.md
